<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Página</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; margin: 20px 0; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        .btn { padding: 8px 16px; margin: 8px 4px; cursor: pointer; }
        .btn-group { display: flex; justify-content: center; }
    </style>
</head>
<body>
    <h1>Mi Página de Ejemplo</h1>
    <button class="btn">Botón Superior</button>
    <table>
        <thead>
            <tr>
                <th>Fecha publicación</th>
                <th>Comuna</th>
                <th>Sector</th>
                <th>Cantidad Tipo Edad</th>
                <th>Foto</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Dato 1</td>
                <td>Dato 2</td>
                <td>Dato 3</td>
            </tr>
            <tr>
                <td>Dato 4</td>
                <td>Dato 5</td>
                <td>Dato 6</td>
            </tr>
        </tbody>
    </table>
    <div class="btn-group">
        <button class="btn">Botón Inferior 1</button>
        <button class="btn">Botón Inferior 2</button>
    </div>
</body>
</html>
